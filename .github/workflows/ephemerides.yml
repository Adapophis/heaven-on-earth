name: Update comet and asteroid ephemerides

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Retrieve JPL Horizons positions
        run: python update_ephemerides.py

      - name: Publish verified ephemerides
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ephemerides.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh JPL comet and asteroid ephemerides'
            git push
          fi
